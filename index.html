<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Studio</title>
<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    :root {
        --ink: #f7f9ff;
        --muted: #c1cce0;
        --line: rgba(255, 255, 255, 0.16);
        --accent: #2563eb;
        --sidebar-w: 240px;
        --card-bg: linear-gradient(145deg, rgba(16, 26, 42, 0.85), rgba(8, 13, 24, 0.74));
        --card-border: rgba(255, 255, 255, 0.17);
        --card-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
        --card-hover-shadow: 0 18px 42px rgba(0, 0, 0, 0.50), 0 0 20px rgba(50, 138, 255, 0.22);
        --input-bg: rgba(8, 15, 29, 0.90);
        --input-border: rgba(255, 255, 255, 0.22);
        --metric-color: #ffe3a0;
        --tag-bg: rgba(21, 35, 59, 0.88);
        --tag-color: #eaf2ff;
        --tag-border: rgba(255, 255, 255, 0.20);
        --btn-primary-bg: linear-gradient(135deg, #3976f5, #2454d1);
        --btn-primary-text: #ffffff;
        --btn-sec-bg: rgba(21, 35, 59, 0.88);
        --btn-sec-text: #eaf2ff;
        --btn-sec-border: rgba(255, 255, 255, 0.22);
        --btn-danger-bg: rgba(165, 44, 64, 0.24);
        --btn-danger-text: #ffb4bf;
        --btn-danger-border: rgba(255, 180, 191, 0.35);
        --table-head: rgba(16, 26, 43, 0.92);
        --bar-track: rgba(255, 255, 255, 0.14);
        --bar-fill: linear-gradient(90deg, #1674ff, #22d3ee);
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
    }

    body {
        isolation: isolate;
        min-height: 100vh;
        background: #030407;
        color: var(--ink);
        font: 14px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color-scheme: dark;
    }

    body:not(.dark) {
        background: #ffffff;
        --ink: #17243b;
        --muted: #475569;
        --line: #dbe4f0;
        --card-bg: rgba(255, 255, 255, 0.90);
        --card-border: rgba(255, 255, 255, 0.96);
        --card-shadow: 0 12px 30px rgba(36, 60, 102, 0.11);
        --card-hover-shadow: 0 18px 38px rgba(36, 60, 102, 0.18), 0 0 16px rgba(59, 130, 246, 0.14);
        --input-bg: #ffffff;
        --input-border: #cbd5e1;
        --metric-color: #244a9e;
        --tag-bg: #edf3ff;
        --tag-color: #244a9e;
        --tag-border: #cbdafa;
        --btn-sec-bg: #edf3ff;
        --btn-sec-text: #244a9e;
        --btn-sec-border: #cbdafa;
        --btn-danger-bg: #fff0f2;
        --btn-danger-text: #a52c40;
        --btn-danger-border: #efc9d0;
        --table-head: #edf3ff;
        --bar-track: #e2e8f0;
        --bar-fill: linear-gradient(90deg, #2856d8, #06b6d4);
        color-scheme: light;
    }

    /* Fixed Aurora World & 3D Golden Spheres */
    .ambient-world {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background:
            radial-gradient(ellipse at 24% 38%, #0754efb0, transparent 43%),
            radial-gradient(ellipse at 53% 63%, #00b9c3a0, transparent 45%),
            radial-gradient(ellipse at 97% 44%, #eab308b8, transparent 47%),
            #030407;
    }

    body:not(.dark) .ambient-world {
        background:
            radial-gradient(ellipse at 24% 38%, #87b5ff99, transparent 43%),
            radial-gradient(ellipse at 53% 63%, #78e5df99, transparent 45%),
            radial-gradient(ellipse at 97% 44%, #ffe08a99, transparent 47%),
            #ffffff;
    }

    .orb {
        position: absolute;
        display: block;
        border-radius: 50%;
        background: radial-gradient(
            circle at 30% 22%,
            #fffbd7 0%,
            #f8e27c 8%,
            #caa02e 25%,
            #8b5415 62%,
            #51300c 83%,
            #d4a73c 100%
        );
        box-shadow: inset -10px -15px 30px #0005, 0 20px 50px #0008;
        animation: drift 8s ease-in-out infinite;
        pointer-events: none;
    }

    .ambient-world .orb.a {
        width: clamp(180px, 24vw, 360px);
        height: clamp(180px, 24vw, 360px);
        left: -9vw;
        top: 15%;
    }

    .ambient-world .orb.b {
        width: 230px;
        height: 230px;
        right: 19%;
        top: -120px;
        animation-delay: -2s;
    }

    .ambient-world .orb.c {
        width: 210px;
        height: 210px;
        right: -65px;
        bottom: 8%;
        animation-delay: -4s;
    }

    .ambient-world .orb.d {
        width: 300px;
        height: 300px;
        left: 36%;
        bottom: -220px;
        animation-delay: -6s;
    }

    @keyframes drift {
        50% {
            transform: translateY(13px) rotate(5deg);
        }
    }

    /* Sidebar (always visible, responsive) */
    aside {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--sidebar-w);
        display: flex;
        flex-direction: column;
        padding: 24px 16px;
        overflow-y: auto;
        overflow-x: hidden;
        z-index: 50;
        background: rgba(5, 9, 19, 0.78);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border-right: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
    }

    body:not(.dark) aside {
        background: rgba(255, 255, 255, 0.92);
        border-right: 1px solid rgba(203, 213, 225, 0.85);
        box-shadow: 8px 0 32px rgba(20, 41, 75, 0.08);
        color: var(--ink);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .brandmark {
        background: linear-gradient(135deg, #fce7a0, #ac7928);
        color: #211504;
        border-radius: 10px;
        padding: 8px 11px;
        font-weight: 800;
        flex-shrink: 0;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    aside h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.4px;
    }

    aside > p {
        margin: 8px 0 22px;
        font-size: 13px;
        color: var(--muted);
    }

    .workspace-label {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1.5px;
        font-weight: 700;
        margin: 0 0 8px 10px;
    }

    aside nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    aside nav button {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        width: 100%;
        min-height: 40px;
        padding: 9px 12px;
        margin: 0;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #c7d4e8;
        font: inherit;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        box-shadow: none;
        flex-shrink: 0;
        transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    body:not(.dark) aside nav button {
        color: #475569;
    }

    aside nav button:hover:not(.active) {
        background: rgba(255, 255, 255, 0.10);
        color: #ffffff;
    }

    body:not(.dark) aside nav button:hover:not(.active) {
        background: #edf3ff;
        color: #244a9e;
    }

    aside nav button.active {
        background: linear-gradient(100deg, #173d8c, #125c87);
        color: #ffffff;
        box-shadow: 0 4px 18px rgba(0, 123, 255, 0.25);
    }

    body:not(.dark) aside nav button.active {
        background: #dceaff;
        color: #17449b;
        box-shadow: none;
    }

    .navicon {
        width: 19px;
        height: 19px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .navicon svg {
        width: 18px;
        height: 18px;
    }

    .theme-toggle {
        width: 100%;
        min-height: 40px;
        margin-top: 14px;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        text-align: left;
        justify-content: flex-start;
        box-shadow: none;
        flex-shrink: 0;
    }

    body:not(.dark) .theme-toggle {
        background: #edf3ff;
        color: #244a9e;
        border-color: #cbdafa;
    }

    aside hr {
        border: 0;
        border-top: 1px solid var(--line);
        width: 100%;
        margin: auto 0 12px;
        padding-top: 12px;
    }

    aside hr + p {
        margin: 0;
        font-size: 12px;
    }

    /* Main Workspace */
    main {
        position: relative;
        margin-left: var(--sidebar-w);
        width: calc(100% - var(--sidebar-w));
        max-width: 1600px;
        min-width: 0;
        padding: 28px clamp(20px, 3.5vw, 48px);
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 14px;
    }

    header small {
        font-size: 11px;
        letter-spacing: 1.4px;
        font-weight: 700;
        color: var(--muted);
    }

    h1 {
        margin: 6px 0 0;
        font-size: clamp(24px, 3vw, 34px);
        letter-spacing: -0.03em;
        line-height: 1.15;
    }

    h2 {
        margin: 0 0 16px;
        font-size: 18px;
        letter-spacing: -0.02em;
    }

    p {
        line-height: 1.6;
        overflow-wrap: anywhere;
    }

    small,
    .muted {
        color: var(--muted);
    }

    .tag {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        background: var(--tag-bg);
        color: var(--tag-color);
        border: 1px solid var(--tag-border);
    }

    #notice {
        min-height: 12px;
        color: var(--muted);
    }

    #notice:not(:empty) {
        padding: 10px 14px;
        border-radius: 10px;
        margin: 12px 0 16px;
        background: var(--tag-bg);
        color: var(--tag-color);
        border: 1px solid var(--tag-border);
    }

    /* Hero */
    .hero {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 360px;
        padding: 54px 28px;
        position: relative;
        text-align: center;
        border-radius: 24px;
        border: 1px solid var(--card-border);
        background: rgba(3, 6, 16, 0.35);
        backdrop-filter: blur(14px);
        margin-bottom: 24px;
        color: #ffffff;
    }

    body:not(.dark) .hero {
        background: rgba(255, 255, 255, 0.40);
        border-color: #ffffff;
        color: var(--ink);
    }

    .hero .hero-copy {
        position: relative;
        z-index: 2;
        max-width: 680px;
        margin: 0 auto;
    }

    .hero small {
        color: inherit;
        letter-spacing: 0.20em;
        font-weight: 700;
        font-size: 11px;
    }

    .hero h2 {
        font-size: clamp(30px, 4.5vw, 58px);
        line-height: 1.06;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        font-weight: 900;
        margin: 16px 0;
        color: inherit;
    }

    .hero p {
        max-width: 520px;
        margin: 0 auto 24px;
        color: inherit;
    }

    .hero-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .hero button {
        border-radius: 999px;
        padding: 12px 22px;
        background: #ffffff;
        color: #101725;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .hero .hero-secondary {
        background: rgba(8, 13, 32, 0.55);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.65);
    }

    body:not(.dark) .hero .hero-secondary {
        background: rgba(255, 255, 255, 0.78);
        color: #17243b;
        border: 1px solid #cbd5e1;
    }

    /* Cards & Grids */
    .card {
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: var(--ink);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: var(--card-shadow);
        min-width: 0;
        transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 16px;
        min-width: 0;
    }

    .dashboard-metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin: 0 0 22px;
    }

    .dashboard-metrics > .card {
        padding: 18px 20px;
        margin: 0;
        border-top: 3px solid #5085f5;
    }

    .dashboard-metrics > .card:hover,
    .grid > .card:hover,
    .product-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--card-hover-shadow);
    }

    .metric {
        font-size: clamp(22px, 2.3vw, 32px);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--metric-color);
        margin: 8px 0 0;
        overflow-wrap: anywhere;
    }

    .split {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-bottom: 22px;
        align-items: start;
    }

    .split > .card {
        margin-bottom: 0;
    }

    .section-gap {
        margin-top: 20px;
    }

    /* Forms: strict label-above-input & equal widths/heights */
    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 16px;
        align-items: start;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        margin-bottom: 16px;
    }

    .form-grid .field {
        margin-bottom: 0;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        margin: 0;
        color: var(--ink);
    }

    input,
    select,
    textarea {
        display: block;
        width: 100%;
        min-width: 0;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--input-border);
        border-radius: 10px;
        background: var(--input-bg);
        color: var(--ink);
        font: inherit;
        line-height: 1.35;
    }

    input[type="file"] {
        padding: 8px 12px;
        cursor: pointer;
    }

    textarea {
        min-height: 118px;
        resize: vertical;
    }

    #output {
        min-height: 260px;
    }

    .field-hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
    }

    /* Buttons & Action Rows */
    button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 18px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--btn-primary-bg);
        color: var(--btn-primary-text);
        font: inherit;
        font-weight: 600;
        line-height: 1.2;
        cursor: pointer;
        transition: transform 0.16s ease, filter 0.16s ease;
    }

    button:hover {
        filter: brightness(1.06);
    }

    button:active {
        transform: translateY(1px);
    }

    button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    button.secondary {
        background: var(--btn-sec-bg);
        color: var(--btn-sec-text);
        border-color: var(--btn-sec-border);
    }

    button.danger {
        background: var(--btn-danger-bg);
        color: var(--btn-danger-text);
        border-color: var(--btn-danger-border);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 2px;
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
    }

    /* Featured Brands & Product Catalog */
    .brand-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin: 10px 0 24px;
    }

    .brand-strip button {
        width: 100%;
        min-height: 44px;
        background: var(--btn-sec-bg);
        color: var(--btn-sec-text);
        border: 1px solid var(--btn-sec-border);
        font-size: 13px;
        font-weight: 700;
    }

    .brand-strip img {
        width: 22px;
        height: 22px;
        object-fit: contain;
        flex-shrink: 0;
    }

    .catalog {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin: 16px 0 24px;
    }

    .product-card {
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--card-shadow);
        min-width: 0;
        transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .product-image {
        position: relative;
        background: #ffffff;
        border-bottom: 1px solid var(--line);
        perspective: 900px;
    }

    .product-photo {
        width: 100%;
        height: 205px;
        object-fit: contain;
        background: #ffffff;
        padding: 18px;
        display: block;
        transition: transform 0.3s ease;
    }

    .product-card:hover .product-photo {
        transform: scale(1.045) rotateY(-4deg);
    }

    .product-photo[hidden],
    .photo-fallback[hidden] {
        display: none !important;
    }

    .photo-fallback {
        padding: 36px 16px;
        text-align: center;
        color: #64748b;
        background: #ffffff;
    }

    .product-info {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 18px;
        min-width: 0;
    }

    .product-info h3 {
        margin: 8px 0;
        font-size: 16px;
        line-height: 1.3;
    }

    .product-info p {
        min-height: 40px;
        margin: 6px 0 10px;
        font-size: 13px;
    }

    .product-info strong {
        font-size: 19px;
        color: var(--metric-color);
        margin-top: auto;
    }

    .product-info .actions {
        margin-top: 12px;
    }

    .product-info .actions button {
        min-height: 38px;
        padding: 8px 12px;
        font-size: 12.5px;
    }

    #productPreview,
    #seoPhoto {
        margin-bottom: 16px;
    }

    #productPreview .product-image,
    #seoPhoto .product-image {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
    }

    #productPreview .product-photo,
    #seoPhoto .product-photo {
        height: 165px;
    }

    /* Charts, Activity, Tables, Details, SEO Preview */
    .bar {
        height: 12px;
        background: var(--bar-track);
        border-radius: 999px;
        overflow: hidden;
    }

    .bar span {
        display: block;
        height: 100%;
        background: var(--bar-fill);
    }

    .chart-filter {
        max-width: 260px;
    }

    .chart-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 42px;
        gap: 12px;
        align-items: center;
        margin: 12px 0;
    }

    .chart-row button {
        display: block;
        width: 100%;
        min-height: 0;
        padding: 4px 0;
        background: transparent;
        color: inherit;
        border: 0;
        text-align: left;
        box-shadow: none;
    }

    .chart-row .bar {
        margin-top: 6px;
        height: 12px;
    }

    .activity {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .activity:last-child {
        border-bottom: 0;
    }

    .activity-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--bar-fill);
        flex-shrink: 0;
    }

    .activity small {
        display: block;
    }

    .table {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 480px;
    }

    th,
    td {
        text-align: left;
        padding: 13px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
        overflow-wrap: anywhere;
    }

    th {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: var(--table-head);
    }

    tr:hover td {
        background: var(--table-head);
    }

    td .actions {
        margin: 0;
    }

    details {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        margin: 10px 0;
    }

    summary {
        cursor: pointer;
        font-weight: 600;
    }

    pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: inherit;
        margin: 12px 0;
    }

    .seo-preview {
        background: #ffffff;
        color: #202124;
        padding: 18px 20px;
        border-radius: 12px;
        border: 1px solid #dfe1e5;
        overflow-wrap: anywhere;
        margin-bottom: 10px;
    }

    .seo-preview small {
        color: #3c4043;
    }

    .seo-preview h3 {
        color: #1a0dab;
        font-size: 19px;
        margin: 6px 0;
    }

    .seo-preview p {
        color: #4d5156;
        margin: 0;
    }

    #seoChecks p {
        margin: 8px 0;
    }

    .footer {
        border-top: 1px solid var(--line);
        margin-top: 32px;
        padding: 18px 0;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 12px;
    }

    /* Tablet Breakpoint */
    @media (max-width: 1120px) {
        :root {
            --sidebar-w: 220px;
        }

        .catalog {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .split {
            grid-template-columns: 1fr;
        }

        .dashboard-metrics {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    /* Mobile / Narrow Tablet Breakpoint */
    @media (max-width: 860px) {
        aside {
            position: static;
            width: 100%;
            height: auto;
            border-right: 0;
            border-bottom: 1px solid var(--line);
            padding: 18px 16px;
        }

        aside > p {
            margin: 6px 0 14px;
        }

        aside nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 6px;
        }

        aside hr {
            margin: 14px 0 10px;
            padding-top: 0;
        }

        main {
            margin-left: 0;
            width: 100%;
            padding: 20px 16px;
        }

        .hero {
            min-height: 300px;
            padding: 36px 18px;
        }
    }

    @media (max-width: 640px) {
        .form-grid {
            grid-template-columns: 1fr;
        }

        .catalog {
            grid-template-columns: 1fr;
        }

        .brand-strip {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .actions > button {
            flex: 1 1 auto;
        }

        .product-photo {
            height: 180px;
        }
    }

    @media (max-width: 420px) {
        .dashboard-metrics {
            grid-template-columns: 1fr;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            transition: none !important;
            animation: none !important;
        }
    }

    @media print {
        .ambient-world,
        aside,
        button,
        #notice,
        .footer,
        .theme-toggle {
            display: none !important;
        }

        body,
        body.dark {
            background: #ffffff;
            color: #111111;
            --ink: #111111;
            --muted: #444444;
        }

        main {
            margin: 0;
            width: 100%;
            padding: 0;
        }

        .card,
        .product-card,
        .hero {
            background: #ffffff;
            color: #111111;
            box-shadow: none;
            backdrop-filter: none;
        }
    }
</style>

        function thumb(p) {

            let shape = bottle
                ? '<rect x="20" y="15" width="24" height="40" rx="8" fill="#7895ad"/><rect x="25" y="7" width="14" height="10" rx="3" fill="#334155"/><path d="M25 25v20" stroke="#dbeafe" stroke-width="3"/>'
                : head

        function dashboardCharts() {

                    + '</select></div><div id="chartBars"></div><p class="muted" id="chartDetail" aria-live="polite">Select a bar to see details.</p>')
                + card('Recent activity',
                    [...db.drafts.map(d => ({ title: d.name, detail: d.type + ' · ' + d.date })),
                     ...db.calendar.map(d => ({ title: d.name, detail: 'Scheduled · ' + d.date }))].reverse().slice(0, 5)

                + '</div>';
        }

        function drawChart() {
            let filter = $('chartFilter').value;
            let counts = new Map();
            db.products.filter(p => !filter || p.category === filter).forEach(p => counts.set(p.category, (counts.get(p.category) || 0) + 1));

            $('chartBars').innerHTML = [...counts].map(([k, n]) =>
                `<div class="chart-row"><button type="button" data-category="${esc(k)}" data-count="${n}" onclick="chartInfo(this)">${esc(k)}<div class="bar"><span style="width:${total ? (100 * n / total) : 0}%"></span></div></button><strong>${n}</strong></div>`
            ).join('') || 'No products';
            $('chartDetail').textContent = total + ' products in this view.';

                            ? table(['Competitor', 'Price', 'Notes', 'Action'], db.competitors.map(d => [esc(d.name), money(d.price), esc(d.notes), `<div class="actions"><button type="button" class="danger" onclick="remove('competitors','${d.id}')">Delete</button></div>`]))
                            : '<p class="muted">No competitor records added yet.</p>');
            }

            if (page === 'Calendar') {
                v = card('Plan a post',
                    `<div class="form-grid">
                        ${field('name', 'Campaign title')}
                        ${field('date', 'Publish date', '', 'date')}
                    </div>
                    ${area('notes', 'Channel / notes')}
                    <div class="actions"><button type="button" onclick="addRecord('calendar')">Schedule</button></div>`)
                    + card('Schedule',
                        db.calendar.length
                            ? table(['Campaign', 'Date', 'Notes', 'Action'], db.calendar.map(d => [esc(d.name), esc(d.date), esc(d.notes), `<div class="actions"><button type="button" class="danger" onclick="remove('calendar','${d.id}')">Delete</button></div>`]))
                            : '<p class="muted">No scheduled posts yet.</p>');
            }

            if (page === 'Analytics') {
                let counts = {};
                db.products.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
                let total = db.products.length || 1;
                v = metrics()
                    + card('Catalog by category',
                        Object.entries(counts).map(([k, n]) =>
                            `<p>${esc(k)} · ${n}</p><div class="bar"><span style="width:${100 * n / total}%"></span></div>`
                        ).join('') || '<p class="muted">No products</p>')
                    + card('Draft activity',
                        db.drafts.length
                            ? table(['Type', 'Mode', 'Date'], db.drafts.map(d => [esc(d.type), esc(d.mode), esc(d.date)]))
                            : '<p class="muted">No draft activity yet.</p>');
            }

            if (page === 'Reports') {
                v = metrics()
                    + card('Workspace report',
                        table(['Product', 'Category', 'Price'], db.products.map(p => [esc(p.name), esc(p.category), money(p.price)]))
                        + '<div class="actions"><button type="button" onclick="window.print()">Print / Save as PDF</button><button type="button" class="secondary" onclick="download(\'workspace.json\',JSON.stringify(db,null,2))">Export data</button></div>');
            }

            if (page === 'Admin') {
                v = card('System information',
                    `<p>Storage: browser local storage (HTML edition).</p>
                    <p>Generation: ${live ? 'Live API available' : 'Offline demo'}</p>
                    <p>Currency: INR</p>
                    <p>For SQLite and Streamlit, run app.py. API keys belong on the server, never in HTML.</p>
                    <div class="actions"><button type="button" onclick="download('backup.json',JSON.stringify(db,null,2))">Export backup</button></div>`);
            }

            $('view').innerHTML = v;
            if (page === 'Dashboard') drawChart();
            if (page === 'Products') {
                $('search').oninput = inventory;
                $('company').onchange = inventory;
                inventory();
            }
            if (page === 'Content Studio') {
                $('product').onchange = productPreview;
                productPreview();
            }
            if (page === 'SEO Optimizer') seoProduct();
        }

        let companyFilter = '';
        const brandDomains = { Apple: 'apple.com', Sony: 'sony.com', Samsung: 'samsung.com', Nike: 'nike.com', boAt: 'boat-lifestyle.com' };
        const brandImages = { "Apple": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgNjAiPjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iNjAiIHJ4PSI4IiBmaWxsPSJ3aGl0ZSIvPjx0ZXh0IHg9IjYwIiB5PSIzNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXdlaWdodD0iYm9sZCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzE2M2MzNCI+QXBwbGU8L3RleHQ+PC9zdmc+", "Sony": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgNjAiPjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iNjAiIHJ4PSI4IiBmaWxsPSJ3aGl0ZSIvPjx0ZXh0IHg9IjYwIiB5PSIzNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXdlaWdodD0iYm9sZCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzE2M2MzNCI+U29ueTwvdGV4dD48L3N2Zz4=", "Samsung": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgNjAiPjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iNjAiIHJ4PSI4IiBmaWxsPSJ3aGl0ZSIvPjx0ZXh0IHg9IjYwIiB5PSIzNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXdlaWdodD0iYm9sZCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzE2M2MzNCI+U2Ftc3VuZzwvdGV4dD48L3N2Zz4=", "Nike": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgNjAiPjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iNjAiIHJ4PSI4IiBmaWxsPSJ3aGl0ZSIvPjx0ZXh0IHg9IjYwIiB5PSIzNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXdlaWdodD0iYm9sZCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzE2M2MzNCI+TmlrZTwvdGV4dD48L3N2Zz4=", "boAt": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgNjAiPjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iNjAiIHJ4PSI4IiBmaWxsPSJ3aGl0ZSIvPjx0ZXh0IHg9IjYwIiB5PSIzNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXdlaWdodD0iYm9sZCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzE2M2MzNCI+Ym9BdDwvdGV4dD48L3N2Zz4=" };

        function brandStrip() {
            return '<h2>Featured companies</h2><div class="brand-strip">'
                + [...new Set(db.products.map(p => p.brand).filter(Boolean))].map(b =>
                    `<button type="button" data-brand="${esc(b)}" onclick="openBrand(this.dataset.brand)">${brandDomains[b] ? `<img alt="" src="${brandImages[b]}" onerror="this.remove()">` : ''}${esc(b)}</button>`
                ).join('')
                + '</div>';
        }

        function openBrand(b) {
            companyFilter = b;
            go('Products');
        }

        function imageMarkup(p) {
            return p.image && /^(https?:\/\/|data:image\/(?:png|jpeg|webp|gif|svg\+xml);base64,|assets\/)/i.test(p.image)
                ? `<div class="product-image"><img class="product-photo" src="${esc(p.image)}" alt="${esc(p.name)}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.hidden=true;this.nextElementSibling.hidden=false"><div class="photo-fallback" hidden>Image unavailable</div></div>`
                : '<div class="photo-fallback">No product image</div>';
        }

        function catalogCards(items) {
            return '<div class="catalog">' + items.map(p =>
                `<article class="product-card">${imageMarkup(p)}<div class="product-info"><small>${esc(p.brand || 'Independent')} · ${esc(p.category)}</small><h3>${esc(p.name)}</h3><p class="muted">${esc(p.features)}</p><strong>${money(p.price)}</strong><div class="actions"><button type="button" data-id="${esc(p.id)}" onclick="createFor(this.dataset.id)">Create content</button>${page === 'Products' ? `<button type="button" class="secondary" data-id="${esc(p.id)}" onclick="edit=this.dataset.id;render();window.scrollTo(0,0)">Edit</button><button type="button" class="danger" data-id="${esc(p.id)}" onclick="remove('products',this.dataset.id)">Delete</button>` : ''}</div></div></article>`
            ).join('') + '</div>';
        }

        function createFor(id) {
            go('Content Studio');
            $('product').value = id;
            productPreview();
        }

        function productPreview() {
            let p = db.products.find(x => x.id === $('product').value);
            $('productPreview').innerHTML = p ? imageMarkup(p) : '';
        }

        function inventory() {
            let q = $('search').value.toLowerCase();
            companyFilter = $('company').value;
            $('inventory').innerHTML = catalogCards(db.products.filter(p =>
                (!companyFilter || p.brand === companyFilter)
                && Object.values(p).join(' ').toLowerCase().includes(q)
            )) || '<p class="muted">No products</p>';
        }

        function loadPhoto(input) {
            const f = input.files[0];
            if (!f) return;
            if (f.size > 1500000) {
                alert("Choose an image under 1.5 MB");
                return;
            }
            const reader = new FileReader();
            reader.onload = () => { $("image").value = reader.result; };
            reader.readAsDataURL(f);
        }

        function productSave() {
            let name = $('name').value.trim(),
                category = $('category').value.trim(),
                price = Number($('price').value),
                features = $('features').value.trim();
            if (!name || !category || !$('price').value || !Number.isFinite(price) || price < 0)
                return msg('Enter a name, category and valid price.');
            let p = {
                id: edit || uid(),
                name,
                category,
                price,
                features,
                brand: $('brand').value.trim(),
                image: $('image').value.trim()
            };
            db.products = db.products.filter(x => x.id !== p.id).concat(p);
            save();
            edit = null;
            render();
            msg('Product saved.');
        }

        function remove(k, id) {
            if (confirm('Delete this record?')) {
                db[k] = db[k].filter(x => x.id !== id);
                save();
                render();
                msg('Record deleted.');
            }
        }

        function addRecord(k) {
            let name = $('name').value.trim(), notes = $('notes').value.trim();
            if (!name) return msg('Enter a name.');
            let d = { id: uid(), name, notes };
            if (k === 'calendar') {
                d.date = $('date').value;
                if (!d.date) return msg('Choose a date.');
            } else {
                d.price = Number($('price').value);
                if (!$('price').value || !Number.isFinite(d.price) || d.price < 0)
                    return msg('Enter a valid price.');
            }
            db[k].push(d);
            save();
            render();
            msg('Record saved.');
        }

        let generatedMode = 'Manual';

        async function generate() {
            let p = db.products.find(p => p.id === $('product').value);
            if (!p) return msg('Add a product first.');
            let type = $('type').value, tone = $('tone').value;
            let b = $('generate');
            b.disabled = true;
            try {
                if (live) {
                    if (!confirm('Send product details to configured LLM API? Charges may apply.')) return;
                    let r = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ product: p, type, tone, extra: $('extra').value })
                    });
                    if (!r.ok) throw Error('API request failed');
                    $('output').value = (await r.json()).text;
                    generatedMode = 'LLM API';
                } else {
                    let base = `${p.name} | ${p.features} | ${money(p.price)}`;
                    let templates = {
                        'SEO title': `${p.name} – ${p.category} | ${money(p.price)}`,
                        'Meta description': `Explore ${p.name}. ${p.features}. Price: ${money(p.price)}.`,
                        'SEO keywords': `${p.name}, ${p.category}, ${p.features}`,
                        'Instagram caption': `Discover ${p.name}! ${p.features}. ${money(p.price)} #ProductSpotlight`,
                        'Marketing email': `Subject: Discover ${p.name}\n\nHello,\nExplore ${p.name}: ${p.features}. Available at ${money(p.price)}.`,
                        'FAQs': `What is the product? ${p.name}\nWhat are its features? ${p.features}\nWhat is the price? ${money(p.price)}`
                    };
                    $('output').value = templates[type] || base;
                    generatedMode = 'Offline template';
                    msg('Demo generated. Tone and additional instructions require live API.');
                }
            } catch (e) {
                msg(e.message);
            } finally {
                b.disabled = false;
            }
        }

        function draftSave() {
            let p = db.products.find(p => p.id === $('product').value), text = $('output').value.trim();
            if (!p || !text) return msg('Generate or enter content first.');
            db.drafts.push({
                id: uid(),
                name: p.name,
                type: $('type').value,
                text,
                mode: generatedMode,
                date: new Date().toLocaleDateString('en-IN')
            });
            save();
            render();
            msg('Draft saved.');
        }

        function download(name, text) {
            let a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
            a.download = name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        if ((() => { try { return localStorage.getItem('studioAuroraThemeV1'); } catch { return null; } })() !== 'light') {
            document.body.classList.add('dark');
            $('themeToggle').textContent = 'Switch to brighter glow';
        }

        $('footerYear').textContent = new Date().getFullYear();
        render();
        if (location.protocol !== 'file:') {
            fetch('/api/status')
                .then(r => r.json())
                .then(d => {
                    live = d.live;
                    $('mode').textContent = live ? 'LLM API ready' : 'Local demo';
                    render();
                })
                .catch(() => { });
        }

        function seoView() {
            return '<div class="split">'
                + card('SEO campaign setup',
                    `<p class="muted">Create search-friendly product metadata and review on-page checks.</p>
                    <div class="field"><label for="seoProduct">Product</label><select id="seoProduct" onchange="seoProduct()">${db.products.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div>
                    <div id="seoPhoto"></div>
                    <div class="form-grid">
                        ${field('seoPrimary', 'Primary keyword')}
                        ${select('seoTone', 'Brand tone', ['Professional', 'Friendly', 'Luxury', 'Persuasive', 'Minimal'])}
                    </div>
                    ${field('seoSecondary', 'Secondary keywords (comma separated)')}
                    ${field('seoAudience', 'Target audience')}
                    <div class="actions"><button type="button" id="seoGenerate" onclick="seoGenerate()">Generate SEO content</button></div>
                    <p class="muted">${live ? 'Gemini API available; requests may incur charges.' : 'Offline template mode.'}</p>`)
                + card('Search optimization results',
                    `<div class="field"><label for="seoTitle">SEO title</label><input id="seoTitle" oninput="seoAnalyze()"><small class="field-hint" id="seoTitleCount"></small></div>
                    <div class="field"><label for="seoMeta">Meta description</label><textarea id="seoMeta" oninput="seoAnalyze()"></textarea><small class="field-hint" id="seoMetaCount"></small></div>
                    <div class="field"><label for="seoKeywords">Suggested keywords</label><textarea id="seoKeywords" oninput="seoAnalyze()"></textarea></div>
                    <div class="actions"><button type="button" onclick="seoSave()">Save SEO draft</button><button type="button" class="secondary" onclick="download('seo-content.txt',seoText())">Download SEO</button></div>`)
                + '</div><div class="split section-gap">'
                + card('Search result preview',
                    '<div class="seo-preview"><small>example.com › products</small><h3 id="seoPreviewTitle">Your SEO title</h3><p id="seoPreviewMeta">Your meta description will appear here.</p></div><p class="muted">Illustrative preview, not a live Google result.</p>')
                + card('SEO quality checks',
                    '<div class="metric" id="seoScore">0 / 100</div><div class="bar"><span id="seoBar" style="width:0%"></span></div><div id="seoChecks"></div><p class="muted">Rule-based score, not a Google ranking prediction.</p>')
                + '</div>'
                + card('Saved SEO content',
                    db.drafts.filter(d => /^SEO|^Meta description/.test(d.type)).map(d =>
                        `<details><summary>${esc(d.name)} · ${esc(d.type)}</summary><pre>${esc(d.text)}</pre><div class="actions"><button type="button" class="danger" onclick="remove('drafts','${d.id}')">Delete</button></div></details>`
                    ).join('') || 'No saved SEO drafts.');
        }

        function seoProduct() {
            let p = db.products.find(p => p.id === $('seoProduct').value);
            $('seoPhoto').innerHTML = p ? imageMarkup(p) : '';
            $('seoPrimary').value = p ? p.name : '';
            $('seoPrimary').oninput = seoAnalyze;
            ['seoTitle', 'seoMeta', 'seoKeywords'].forEach(id => $(id).value = '');
            generatedMode = 'Manual';
            seoAnalyze();
        }

        function seoAnalyze() {
            if (!$('seoTitle')) return;
            let t = $('seoTitle').value.trim(), m = $('seoMeta').value.trim(), k = $('seoPrimary').value.trim().toLowerCase();
            $('seoTitleCount').textContent = t.length + ' characters · suggested 30–60';
            $('seoMetaCount').textContent = m.length + ' characters · suggested 120–160';
            $('seoPreviewTitle').textContent = t || 'Your SEO title';
            $('seoPreviewMeta').textContent = m || 'Your meta description will appear here.';
            let checks = [
                [t.length >= 30 && t.length <= 60, 'Title length 30–60'],
                [m.length >= 120 && m.length <= 160, 'Description length 120–160'],
                [!!k && t.toLowerCase().includes(k), 'Primary keyword in title'],
                [!!k && m.toLowerCase().includes(k), 'Primary keyword in description'],
                [!!$('seoKeywords').value.trim(), 'Keyword suggestions present']
            ];
            let score = 20 * checks.filter(c => c[0]).length;
            $('seoScore').textContent = score + ' / 100';
            $('seoBar').style.width = score + '%';
            let words = m.split(/\s+/).filter(Boolean).length;
            let hits = k ? m.toLowerCase().split(k).length - 1 : 0;
            $('seoChecks').innerHTML = checks.map(c => `<p>${c[0] ? '✓' : '○'} ${c[1]}</p>`).join('')
                + `<p>Primary phrase occurrences in description: ${hits} (${words ? (100 * hits / words).toFixed(1) : 0}% of word count)</p>`;
        }

        async function seoGenerate() {
            let p = db.products.find(p => p.id === $('seoProduct').value), k = $('seoPrimary').value.trim();
            if (!p || !k) return msg('Select a product and enter a primary keyword.');
            let b = $('seoGenerate'), secondary = $('seoSecondary').value, audience = $('seoAudience').value, tone = $('seoTone').value;
            b.disabled = true;
            try {
                let results;
                if (live) {
                    if (!confirm('Send product details to configured LLM API? Charges may apply.')) return;
                    results = await Promise.all(['SEO title', 'Meta description', 'SEO keywords'].map(async type => {
                        let r = await fetch('/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                product: { ...p, image: undefined },
                                type,
                                tone,
                                extra: `Primary keyword: ${k}. Secondary keywords: ${secondary}. Audience: ${audience}. Return only the requested ${type}, no markdown or explanation. Title 30–60 characters; meta description 120–160 characters; keywords comma separated. Do not invent product facts.`
                            })
                        });
                        if (!r.ok) throw Error('SEO API request failed');
                        let d = await r.json();
                        if (typeof d.text !== 'string') throw Error('Invalid API response');
                        return d.text.trim();
                    }));
                    generatedMode = 'LLM API';
                } else {
                    results = [
                        `${k} | ${p.category}`,
                        `Explore ${k}. ${p.features}. Discover product details and pricing at ${money(p.price)}.`,
                        [k, secondary, p.category].filter(Boolean).join(', ')
                    ];
                    generatedMode = 'Offline template';
                }
                if (!$('seoTitle') || $('seoGenerate') !== b) return;
                ['seoTitle', 'seoMeta', 'seoKeywords'].forEach((id, i) => $(id).value = results[i]);
                seoAnalyze();
                msg(generatedMode + ' SEO content generated.');
            } catch (e) {
                msg(e.message);
            } finally {
                b.disabled = false;
            }
        }

        function seoText() {
            return 'SEO title: ' + $('seoTitle').value + '\nMeta description: ' + $('seoMeta').value + '\nKeywords: ' + $('seoKeywords').value;
        }

        function seoSave() {
            let p = db.products.find(p => p.id === $('seoProduct').value);
            if (!p || !$('seoTitle').value.trim() || !$('seoMeta').value.trim())
                return msg('Enter a title and description first.');
            db.drafts.push({
                id: uid(),
                name: p.name,
                type: 'SEO package',
                text: seoText(),
                mode: generatedMode,
                date: new Date().toLocaleDateString('en-IN')
            });
            save();
            msg('SEO draft saved. Open SEO Optimizer again to refresh saved drafts.');
        }
    </script>
</body>
</html>
